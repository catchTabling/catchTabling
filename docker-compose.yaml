services:
  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    command: ["redis-server", "--save", ""]  # persistence 비활성화
    ports:
      - "6379:6379"
    networks:
      - springboot-mysql-net

  mysql:
    image: 'mysql:latest'
    container_name: mysql
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 20s
      retries: 10
    networks:
      - springboot-mysql-net

  spring-boot-app:
    container_name: spring-boot-app
    build:
      context: ./
      dockerfile: Dockerfile
    restart:
      on-failure
    ports:
      - '8080:8080'
    depends_on:
      mysql:
       condition: service_healthy

    networks:
      - springboot-mysql-net

networks:
  springboot-mysql-net:
    driver: bridge